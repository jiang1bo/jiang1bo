# ====================================================================
# Hugo 静态网站构建与部署工作流配置
# 文件名: .github/workflows/hugo.yaml
# 作用: 当代码推送到 main 分支或手动触发时，自动构建并部署 Hugo 网站到 GitHub Pages
# ====================================================================

# 工作流名称
name: Build and deploy

# 触发条件配置
on:
  # 1. 推送事件触发条件
  push:
    # 仅当推送到 main 分支时触发
    branches:
      - main
  
  # 2. 手动触发条件
  workflow_dispatch:
    # 允许在 GitHub Actions 页面手动运行此工作流

# 权限配置
permissions:
  contents: read    # 读取仓库内容
  pages: write      # 写入 GitHub Pages
  id-token: write   # 写入 ID 令牌（用于 Pages 部署身份验证）

# 并发控制配置
concurrency:
  group: pages               # 同一组的任务会排队执行
  cancel-in-progress: false  # 不取消正在进行的任务

# 默认运行环境配置
defaults:
  run:
    shell: bash  # 所有步骤默认使用 bash shell

# 工作流任务定义
jobs:
  # 构建任务：负责编译 Hugo 网站
  build:
    runs-on: ubuntu-latest  # 使用最新的 Ubuntu 系统作为运行环境
    
    # 环境变量配置
    env:
      DART_SASS_VERSION: 1.93.2   # Dart Sass 版本（用于 SCSS/Sass 编译）
      GO_VERSION: 1.25.3          # Go 语言版本（Hugo 是用 Go 编写的）
      HUGO_VERSION: 0.152.2       # Hugo 版本（必须是扩展版以支持 Sass）
      NODE_VERSION: 22.20.0       # Node.js 版本（用于 Node.js 依赖）
      TZ: Europe/Oslo             # 设置时区（影响构建过程中的时间相关操作）
    
    # 构建步骤序列
    steps:
      # 步骤 1: 检出代码
      - name: Checkout
        uses: actions/checkout@v5  # 使用官方 checkout 动作
        with:
          submodules: recursive    # 递归检出子模块（如果主题是子模块则必须）
          fetch-depth: 0           # 获取完整的 Git 历史记录（用于 GitInfo 等功能）
      
      # 步骤 2: 设置 Go 环境
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}  # 使用上面定义的 Go 版本
          cache: false                       # 不缓存 Go 模块（因为 Hugo 是预编译的）
      
      # 步骤 3: 设置 Node.js 环境
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}  # 使用上面定义的 Node.js 版本
      
      # 步骤 4: 配置 GitHub Pages
      - name: Setup Pages
        id: pages  # 为此步骤设置 ID，以便后续步骤引用其输出
        uses: actions/configure-pages@v5  # 配置 Pages 环境
      
      # 步骤 5: 创建用户本地可执行文件目录
      - name: Create directory for user-specific executable files
        run: |
          mkdir -p "${HOME}/.local"  # 创建本地二进制文件目录
      
      # 步骤 6: 安装 Dart Sass（Hugo 扩展版需要）
      - name: Install Dart Sass
        run: |
          # 下载指定版本的 Dart Sass
          curl -sLJO "https://github.com/sass/dart-sass/releases/download/${DART_SASS_VERSION}/dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz"
          # 解压到用户本地目录
          tar -C "${HOME}/.local" -xf "dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz"
          # 清理下载的压缩包
          rm "dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz"
          # 将 Dart Sass 路径添加到系统 PATH
          echo "${HOME}/.local/dart-sass" >> "${GITHUB_PATH}"
      
      # 步骤 7: 安装 Hugo（必须是扩展版以支持 Sass）
      - name: Install Hugo
        run: |
          # 下载指定版本的 Hugo 扩展版
          curl -sLJO "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          # 创建 Hugo 目录
          mkdir "${HOME}/.local/hugo"
          # 解压到用户本地目录
          tar -C "${HOME}/.local/hugo" -xf "hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          # 清理下载的压缩包
          rm "hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          # 将 Hugo 路径添加到系统 PATH
          echo "${HOME}/.local/hugo" >> "${GITHUB_PATH}"
      
      # 步骤 8: 验证所有安装
      - name: Verify installations
        run: |
          # 检查各个工具的版本，确保安装成功
          echo "Dart Sass: $(sass --version)"
          echo "Go: $(go version)"
          echo "Hugo: $(hugo version)"
          echo "Node.js: $(node --version)"
      
      # 步骤 9: 安装 Node.js 依赖（如果有 package.json）
      - name: Install Node.js dependencies
        run: |
          # 如果存在 package-lock.json 或 npm-shrinkwrap.json，则执行 npm ci
          [[ -f package-lock.json || -f npm-shrinkwrap.json ]] && npm ci || true
          # npm ci 是 clean install，比 npm install 更快更可靠，适合 CI/CD 环境
      
      # 步骤 10: 配置 Git
      - name: Configure Git
        run: |
          # 禁用 Git 的引用路径引用，避免特殊字符被转义
          git config core.quotepath false
      
      # 步骤 11: 恢复缓存（如果存在）
      - name: Cache restore
        id: cache-restore  # 为此步骤设置 ID，以便后续步骤引用
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/hugo_cache  # 缓存目录路径
          key: hugo-${{ github.run_id }}       # 主缓存键（基于运行 ID）
          restore-keys:                        # 备用缓存键（如果没有精确匹配）
            hugo-                              # 前缀匹配，使用最近的缓存
      
      # 步骤 12: 构建网站（核心步骤）
      # 使用 Hugo 构建静态网站，参数说明：
      # 启用垃圾回收（清理未使用的文件）
      # 启用最小化（压缩 HTML、CSS、JS）
      # 设置基础 URL（从 Pages 步骤获取）
      #--baseURL "${{ steps.pages.outputs.base_url }}/" \
      #--baseURL "https://${{ github.repository_owner }}.github.io/" \
      # 设置缓存目录
      - name: Build the site

        run: |
  # 自动设置 baseURL，处理用户名仓库和项目仓库
  if [ "${{ github.event.repository.name }}" = "${{ github.repository_owner }}.github.io" ]; then
    # 用户名仓库
    base_url="https://${{ github.repository_owner }}.github.io/"
  else
    # 项目仓库
    base_url="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
  fi
  
  echo "🚀 Building Hugo site for: $base_url"
  
  hugo \
    --gc \
    --minify \
    --baseURL "$base_url" \
    --cacheDir "${{ runner.temp }}/hugo_cache"
  
  echo "✅ Build completed successfully!"        
      
      # 步骤 13: 保存缓存
      - name: Cache save
        id: cache-save
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/hugo_cache  # 要缓存的目录
          key: ${{ steps.cache-restore.outputs.cache-primary-key }}  # 使用恢复时生成的缓存键
      
      # 步骤 14: 上传构建产物
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public  # Hugo 默认输出目录
  
  # 部署任务：负责将构建产物部署到 GitHub Pages
  deploy:
    # 部署环境配置
    environment:
      name: github-pages  # 环境名称（显示在 GitHub 仓库的 Environments 中）
      url: ${{ steps.deployment.outputs.page_url }}  # 环境 URL（部署后的网站地址）
    
    runs-on: ubuntu-latest  # 使用最新的 Ubuntu 系统
    
    needs: build  # 依赖关系：必须先完成 build 任务
    
    # 部署步骤序列
    steps:
      # 步骤 1: 部署到 GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment  # 为此步骤设置 ID
        uses: actions/deploy-pages@v4  # 使用官方 Pages 部署动作