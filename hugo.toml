#verification map 网站验证代码，用于 Google/Bing/Yandex/Pinterest/Baidu/360/Sogou。
[params.verification]
    google = ""
    bing = ""
    yandex = ""
    pinterest = ""
    baidu = ""
    so = ""
    sogou = ""


#seo map SEO 配置。
[params.seo]
    image = ""
    thumbnailUrl = ""

#compatibility map 兼容性设置。
[params.compatibility]
    polyfill = false
    objectFit = false


#backToTop FixIt 0.2.16 | 新增 map 返回顶部按钮配置。
[params.backToTop]
    enable = true
    scrollpercent = true

#readingProgress FixIt 0.2.16 | 新增 map 阅读进度条配置。
[params.readingProgress]
    enable = false
    start = "left"
    position = "top"
    reversed = false
    light = ""
    dark = ""
    height = "2px"

#cacheRemotebool 是否缓存远程图片以获得更好的优化效果，默认：false。
#optimisebool 是否对图片进行缩放和优化，默认：false。
[params.image]
  cacheRemote = false
  optimise = false

#recentlyUpdated FixIt 0.3.13 | 新增 map 最近更新文章设置。
[params.recentlyUpdated]
    archives = true
    section = true
    list = true
    days = 30
    maxCount = 10

#busuanzi FixIt 0.3.10 | 新增 map 不蒜子计数器配置。
[params.busuanzi]
    enable = true
    source = "https://vercount.one/js"
    siteViews = true
    pageViews = true




#搜索设置
  [params.search]
    enable = true
    type = "fuse"
    contentLength = 4000
    placeholder = ""
    maxResultLength = 10
    snippetLength = 30
    highlightTag = "em"
    absoluteURL = false
    
    [params.search.fuse]
      isCaseSensitive = true
      minMatchCharLength = 2
      findAllMatches = false
      location = 0
      threshold = 0.3
      distance = 100
      ignoreLocation = false
      useExtendedSearch = true
      ignoreFieldNorm = false

#页面底部信息设置
[params.footer]
    enable = true
    copyright = true
    author = true
    since = ""
    gov = "china"
    icp = "20251129"
    license = ""
    [params.footer.powered]
      enable = true
      hugoLogo = true
      themeLogo = true
    [params.footer.siteTime]
      enable = true
      animate = true
      icon = "fa-solid fa-heartbeat"
      pre = ""
      value = "2021-11-11"
    [params.footer.order]
      powered = 0
      copyright = 0
      statistics = 0
      visitor = 0
      beian = 0

#自定义输出设置
[mediaTypes]
  [mediaTypes."text/markdown"]
    suffixes = ["md"]

[outputFormats]
  #  用于输出 /archives/index.html 文件的设置
  [outputFormats.archives]
    path = "archives"
    baseName = "index"
    mediaType = "text/html"
    isPlainText = false
    isHTML = true
    permalinkable = true
  #  用于输出 /offline/index.html 文件的设置
  [outputFormats.offline]
    path = "offline"
    baseName = "index"
    mediaType = "text/html"
    isPlainText = false
    isHTML = true
    permalinkable = true
  #  用于输出 readme.md 文件的设置
  [outputFormats.readme]
    baseName = "readme"
    mediaType = "text/markdown"
    isPlainText = true
    isHTML = false
  #  用于输出 baidu_urls.txt 文件的设置
  [outputFormats.baidu_urls]
    baseName = "baidu_urls"
    mediaType = "text/plain"
    isPlainText = true
    isHTML = false
  #  用于输出 search.json 文件的设置
  [outputFormats.search]
    baseName = "search"
    mediaType = "application/json"
    rel = "search"
    isPlainText = true
    isHTML = false
    permalinkable = true

    
[markup]
  _merge = "shallow"
[outputs]
  _merge = "shallow"
[taxonomies]
  _merge = "shallow"

[params]
description = 'welcome to femris的博客网站!'
keywords = ["Hugo", "FixIt"]
#是否显示纯文本摘要，默认：false
summaryPlainify = 'true'


#header map 页面头部导航栏配置。
[params.header]
#桌面端导航栏模式，可选值：sticky、normal、auto, 默认：sticky。
    desktopMode = "sticky"
#移动端导航栏模式，可选值：sticky、normal、auto, 默认：auto。
    mobileMode = "auto"



[params.page]
# FixIt 0.2.18 | 新增 是否启用文章作者头像
    authorAvatar = true
# 代码块包装器配置
    [params.page.code]
      # FixIt 0.3.9 | 新增 是否启用代码块包装器
      enable = true
      # 是否显示代码块包装器的复制按钮
      copy = true
      # FixIt 0.2.13 | 新增 是否显示代码块包装器的编辑按钮
      edit = false
      # 默认展开显示的代码行数
      maxShownLines = 10